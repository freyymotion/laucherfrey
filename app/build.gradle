plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseKeystoreFile = System.getenv('RELEASE_KEYSTORE_FILE')
def releaseKeystorePassword = System.getenv('RELEASE_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('RELEASE_KEY_PASSWORD')
def hasReleaseSigning = releaseKeystoreFile &&
        releaseKeystorePassword &&
        releaseKeyAlias &&
        releaseKeyPassword &&
        file(releaseKeystoreFile).exists()

android {
    namespace 'com.simples.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.simples.launcher"
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName "1.0.1"
    }
    buildFeatures { buildConfig true }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystoreFile)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
